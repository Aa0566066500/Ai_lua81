<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lua AI Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: #0b0e14; color: #e6edf3; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* الهيدر وقائمة النماذج */
        header { background-color: #0d1117; padding: 12px 20px; border-bottom: 1px solid #21262d; display: flex; align-items: center; justify-content: space-between; z-index: 10; position: relative; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .menu-btn { background: none; border: none; cursor: pointer; color: #58a6ff; display: flex; align-items: center; justify-content: center; padding: 6px; border-radius: 8px; }

        .model-selector-btn { background: #161b22; border: 1px solid #30363d; color: #e6edf3; padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .model-selector-btn:hover { border-color: #58a6ff; }
        
        .model-dropdown { position: absolute; top: 55px; left: 20px; background: #161b22; border: 1px solid #30363d; border-radius: 14px; width: 220px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: none; flex-direction: column; z-index: 200; overflow: hidden; }
        .model-dropdown.active { display: flex; }
        .model-option { padding: 12px 16px; cursor: pointer; display: flex; flex-direction: column; border-bottom: 1px solid #21262d; }
        .model-option:last-child { border-bottom: none; }
        .model-option:hover { background: #21262d; }
        .model-option-title { font-weight: 700; font-size: 0.9rem; color: #fff; display: flex; justify-content: space-between; align-items: center; }
        .model-option-desc { font-size: 0.75rem; color: #8b949e; margin-top: 2px; }

        /* القائمة الجانبية */
        .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px); z-index: 100; display: none; }
        .sidebar-overlay.active { display: block; }
        .sidebar { position: fixed; top: 0; right: -380px; width: 340px; height: 100%; background-color: #0d1117; border-left: 1px solid #30363d; z-index: 101; display: flex; flex-direction: column; transition: right 0.3s ease; justify-content: space-between; }
        .sidebar.active { right: 0; }
        .sidebar-header { padding: 16px 20px; border-bottom: 1px solid #21262d; display: flex; justify-content: space-between; align-items: center; font-weight: 700; color: #58a6ff; }
        .sidebar-close { background: #21262d; border: none; color: #c9d1d9; width: 30px; height: 30px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .sidebar-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; justify-content: space-between; }
        .sidebar-section { padding: 16px 20px; border-bottom: 1px solid #21262d; }
        .sidebar-section h3 { font-size: 0.8rem; color: #8b949e; margin-bottom: 10px; text-transform: uppercase; }
        .chat-list { display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow-y: auto; }
        .chat-item { background: #161b22; border: 1px solid #30363d; padding: 10px 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; cursor: pointer; }
        .chat-delete-btn { background: none; border: none; color: #8b949e; cursor: pointer; }
        .sidebar-nav-item { background: #161b22; border: 1px solid #30363d; padding: 10px 14px; border-radius: 10px; color: #58a6ff; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 0.9rem; }

        /* منطقة الشات */
        .app-view { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
        .message { max-width: 85%; padding: 14px 18px; border-radius: 16px; line-height: 1.6; word-wrap: break-word; font-size: 0.95rem; }
        .user-message { background: #1f6feb; color: #fff; align-self: flex-start; border-bottom-right-radius: 4px; }
        .ai-message { background: #161b22; border: 1px solid #30363d; color: #e6edf3; align-self: flex-end; border-bottom-left-radius: 4px; width: 92%; }

        /* صندوق إتاحة الميديا داخل الرسائل */
        .media-preview-box { background: #0d1117; border: 1px solid #30363d; border-radius: 10px; padding: 8px; margin-bottom: 10px; max-width: 200px; }
        .media-preview-box img { width: 100%; max-height: 180px; object-fit: cover; border-radius: 6px; display: block; }
        .media-preview-box .file-tag { font-size: 0.8rem; color: #79c0ff; word-break: break-all; }

        /* شريط الدردشة البيضاوي العائم (مطابق للصورة) */
        .chat-input-wrapper { padding: 12px 16px; background: transparent; position: relative; }
        
        /* معاينة الميديا المرفقة قبل الإرسال */
        .attachment-preview-bar { display: none; background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 8px 12px; margin-bottom: 8px; align-items: center; justify-content: space-between; }
        .attachment-preview-bar.active { display: flex; }
        .preview-info { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: #79c0ff; }
        .preview-thumb { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; }
        .remove-attachment-btn { background: none; border: none; color: #f85149; cursor: pointer; }

        .floating-input-bar { background: #161b22; border: 1px solid #30363d; border-radius: 30px; padding: 6px 10px 6px 6px; display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        .plus-btn { background: none; border: none; color: #e6edf3; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .plus-btn:hover { background: #21262d; }
        
        #user-input { flex: 1; background: transparent; border: none; outline: none; color: #e6edf3; font-size: 0.95rem; resize: none; height: 24px; max-height: 100px; line-height: 24px; }
        
        .input-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .icon-btn { background: none; border: none; color: #8b949e; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .send-pill-btn { background: #1f6feb; border: none; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .send-pill-btn svg { fill: #ffffff; width: 18px; height: 18px; }

        /* قائمة الزر (+) العائمة */
        .attach-popup-menu { position: absolute; bottom: 70px; right: 20px; background: #161b22; border: 1px solid #30363d; border-radius: 14px; width: 180px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); display: none; flex-direction: column; z-index: 150; overflow: hidden; }
        .attach-popup-menu.active { display: flex; }
        .attach-menu-item { padding: 12px 16px; font-size: 0.88rem; color: #e6edf3; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .attach-menu-item:hover { background: #21262d; color: #58a6ff; }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <button class="menu-btn" id="menuToggleBtn">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            
            <button class="model-selector-btn" id="modelSelectorBtn">
                <span id="currentModelLabel">3.6 Flash</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
        </div>

        <div class="model-dropdown" id="modelDropdown">
            <div class="model-option" data-model="3.5-lite">
                <div class="model-option-title">3.5 Flash-Lite <span class="check-mark"></span></div>
                <div class="model-option-desc">أسرع الإجابات للمهام الخفيفة</div>
            </div>
            <div class="model-option" data-model="3.6-flash">
                <div class="model-option-title">3.6 Flash <span class="check-mark">✓</span></div>
                <div class="model-option-desc">مساعدة متكاملة للأكواد والتحليل</div>
            </div>
        </div>
    </header>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span>القائمة والتحكم</span>
            <button class="sidebar-close" id="sidebarCloseBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div class="sidebar-body">
            <div class="sidebar-section">
                <h3>سجل المحادثات</h3>
                <div class="chat-list" id="chatListContainer"></div>
            </div>
            <div class="sidebar-section">
                <h3>الأدوات الرئيسية</h3>
                <div class="sidebar-nav-item" id="newChatNavBtn" style="color: #3fb950;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    محادثة جديدة
                </div>
            </div>
        </div>
    </div>

    <!-- واجهة الدردشة الرئيسية -->
    <div id="chatView" class="app-view">
        <div id="chat-container">
            <div class="message ai-message">
                <p>مرحباً بك! أنا مساعدك الذكي لبرمجة وتحليل ألعاب Roblox. أرسل استفسارك، أو كودك، أو صورة للتحليل.</p>
            </div>
        </div>

        <div class="chat-input-wrapper">
            <!-- قائمة الخيارات عند الضغط على (+) -->
            <div class="attach-popup-menu" id="attachPopupMenu">
                <div class="attach-menu-item" id="optCamera">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                    الكاميرا
                </div>
                <div class="attach-menu-item" id="optPhotos">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                    ألبوم الصور
                </div>
                <div class="attach-menu-item" id="optFiles">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg>
                    الملفات
                </div>
            </div>

            <!-- مدخلات الملفات الخفية -->
            <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">
            <input type="file" id="photoInput" accept="image/*" style="display:none;">
            <input type="file" id="fileInput" accept=".lua,.txt,.json,.js" style="display:none;">

            <!-- بار معاينة الصورة/الملف المرفق قبل الإرسال -->
            <div class="attachment-preview-bar" id="attachmentPreviewBar">
                <div class="preview-info" id="previewInfo"></div>
                <button class="remove-attachment-btn" id="removeAttachmentBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>

            <!-- شريط الكتابة البيضاوي الاحترافي -->
            <div class="floating-input-bar">
                <button class="plus-btn" id="plusMenuToggle">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </button>
                
                <textarea id="user-input" placeholder="اكتب رسالتك..." rows="1"></textarea>
                
                <div class="input-actions">
                    <button class="icon-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                    </button>
                    <button class="send-pill-btn" id="sendBtn">
                        <svg viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5" stroke="#fff" stroke-width="2.5" stroke-linecap="round"></line><polyline points="5 12 12 5 19 12" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"></polyline></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentSelectedModel = '3.6-flash';
        let attachedImageBase64 = null;
        let attachedImageMime = null;
        let attachedFileName = null;

        const modelSelectorBtn = document.getElementById('modelSelectorBtn');
        const modelDropdown = document.getElementById('modelDropdown');
        const currentModelLabel = document.getElementById('currentModelLabel');

        const plusMenuToggle = document.getElementById('plusMenuToggle');
        const attachPopupMenu = document.getElementById('attachPopupMenu');

        const cameraInput = document.getElementById('cameraInput');
        const photoInput = document.getElementById('photoInput');
        const fileInput = document.getElementById('fileInput');

        const attachmentPreviewBar = document.getElementById('attachmentPreviewBar');
        const previewInfo = document.getElementById('previewInfo');
        const removeAttachmentBtn = document.getElementById('removeAttachmentBtn');

        const sendBtn = document.getElementById('sendBtn');
        const userInput = document.getElementById('user-input');
        const chatContainer = document.getElementById('chat-container');

        // التبديل بين النماذج (3.5 و 3.6)
        modelSelectorBtn.onclick = (e) => { e.stopPropagation(); modelDropdown.classList.toggle('active'); };
        document.onclick = () => { modelDropdown.classList.remove('active'); attachPopupMenu.classList.remove('active'); };

        document.querySelectorAll('.model-option').forEach(opt => {
            opt.onclick = () => {
                currentSelectedModel = opt.getAttribute('data-model');
                currentModelLabel.textContent = (currentSelectedModel === '3.5-lite') ? '3.5 Flash-Lite' : '3.6 Flash';
                
                document.querySelectorAll('.check-mark').forEach(c => c.textContent = '');
                opt.querySelector('.check-mark').textContent = '✓';
            };
        });

        // فتح قائمة (+) المرفقات
        plusMenuToggle.onclick = (e) => { e.stopPropagation(); attachPopupMenu.classList.toggle('active'); };

        document.getElementById('optCamera').onclick = () => cameraInput.click();
        document.getElementById('optPhotos').onclick = () => photoInput.click();
        document.getElementById('optFiles').onclick = () => fileInput.click();

        // قراءة وتجهيز الصور
        function handleImageSelection(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                attachedImageBase64 = e.target.result.split(',')[1];
                attachedImageMime = file.type;
                attachedFileName = file.name;

                previewInfo.innerHTML = `
                    <img src="${e.target.result}" class="preview-thumb">
                    <span>${file.name}</span>
                `;
                attachmentPreviewBar.classList.add('active');
            };
            reader.readAsDataURL(file);
        }

        cameraInput.onchange = (e) => handleImageSelection(e.target.files[0]);
        photoInput.onchange = (e) => handleImageSelection(e.target.files[0]);

        // قراءة الملفات النصية البرمجية
        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                userInput.value += `\n[محتوى ملف ${file.name}]:\n` + evt.target.result;
                previewInfo.innerHTML = `<span>تم إرفاق الملف: ${file.name}</span>`;
                attachmentPreviewBar.classList.add('active');
            };
            reader.readAsText(file);
        };

        removeAttachmentBtn.onclick = () => {
            attachedImageBase64 = null;
            attachedImageMime = null;
            attachedFileName = null;
            attachmentPreviewBar.classList.remove('active');
        };

        // إرسال الرسالة
        sendBtn.onclick = async () => {
            const text = userInput.value.trim();
            if (!text && !attachedImageBase64) return;

            // بناء رسالة المستخدم بالواجهة
            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'message user-message';
            
            if (attachedImageBase64) {
                userMsgDiv.innerHTML += `
                    <div class="media-preview-box">
                        <img src="data:${attachedImageMime};base64,${attachedImageBase64}">
                    </div>
                `;
            }
            if (text) {
                userMsgDiv.innerHTML += `<p>${text}</p>`;
            }
            chatContainer.appendChild(userMsgDiv);

            // تحديد رسالة الانتظار بحسب المحتوى
            const aiMsgDiv = document.createElement('div');
            aiMsgDiv.className = 'message ai-message';
            
            if (attachedImageBase64) {
                aiMsgDiv.textContent = "جاري تحليل الصورة بالذكاء الاصطناعي...";
            } else if (text.includes("[محتوى ملف")) {
                aiMsgDiv.textContent = "جاري تحليل الملف الأكواد البرمجية...";
            } else {
                aiMsgDiv.textContent = "جاري المعالجة والتحليل...";
            }
            chatContainer.appendChild(aiMsgDiv);

            // تجهيز البيانات للإرسال
            const payload = {
                message: text,
                model: currentSelectedModel,
                image: attachedImageBase64 ? { data: attachedImageBase64, mimeType: attachedImageMime } : null
            };

            // تفريغ المدخلات
            userInput.value = '';
            removeAttachmentBtn.click();

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                
                if (data.success) {
                    aiMsgDiv.textContent = data.reply;
                } else {
                    aiMsgDiv.textContent = "خطأ: " + data.error;
                }
            } catch (err) {
                aiMsgDiv.textContent = "حدث خطأ أثناء الاتصال بالسيرفر.";
            }
        };

        // تحكم القائمة الجانبية
        const menuToggleBtn = document.getElementById('menuToggleBtn');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const sidebarCloseBtn = document.getElementById('sidebarCloseBtn');

        menuToggleBtn.onclick = () => { sidebar.classList.add('active'); sidebarOverlay.classList.add('active'); };
        sidebarCloseBtn.onclick = () => { sidebar.classList.remove('active'); sidebarOverlay.classList.remove('active'); };
        sidebarOverlay.onclick = sidebarCloseBtn.onclick;
    </script>
</body>
</html>
