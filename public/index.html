<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lua AI</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0d10;
            color: #fff;
            height: 100vh;
        }
        .app {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* Header */
        .header {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 22px;
            border-bottom: 1px solid #20242a;
            background: #0d1014;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 17px;
            font-weight: 600;
        }
        .brand-icon {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 9px;
            background: #1677ff;
        }
        .brand-icon svg {
            width: 19px;
            height: 19px;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #8c949f;
            font-size: 12px;
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #31d158;
        }
        /* Chat */
        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 35px 18px;
        }
        .messages {
            width: 100%;
            max-width: 850px;
            margin: auto;
        }
        .welcome {
            text-align: center;
            margin-top: 15vh;
            color: #8c949f;
        }
        .welcome h1 {
            color: #fff;
            font-size: 27px;
            margin-bottom: 10px;
        }
        .welcome p {
            font-size: 14px;
        }
        .message {
            display: flex;
            margin-bottom: 25px;
        }
        .message.user {
            justify-content: flex-start;
        }
        .message.ai {
            justify-content: flex-end;
        }
        .bubble {
            max-width: 80%;
            padding: 13px 16px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.7;
            white-space: pre-wrap;
        }
        .user .bubble {
            background: #1677ff;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .ai .bubble {
            background: #15191e;
            border: 1px solid #252a31;
            color: #dce1e7;
            border-bottom-left-radius: 4px;
        }
        /* Code Box */
        .code-box {
            margin-top: 12px;
            background: #090b0e;
            border: 1px solid #292f36;
            border-radius: 10px;
            overflow: hidden;
            direction: ltr;
            text-align: left;
        }
        .code-header {
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            background: #11151a;
            border-bottom: 1px solid #292f36;
        }
        .code-language {
            color: #7e8792;
            font-size: 11px;
            font-family: monospace;
        }
        .copy-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            border: 0;
            background: transparent;
            color: #89929d;
            cursor: pointer;
            font-size: 11px;
            padding: 6px 8px;
            border-radius: 6px;
        }
        .copy-btn:hover {
            background: #20252b;
            color: #fff;
        }
        .copy-btn svg {
            width: 14px;
            height: 14px;
        }
        pre {
            margin: 0;
            padding: 15px;
            overflow-x: auto;
            color: #d9e0e8;
            font-family: Consolas, monospace;
            font-size: 13px;
            line-height: 1.6;
        }
        code {
            font-family: inherit;
        }
        /* Input */
        .input-area {
            padding: 15px 18px 20px;
            border-top: 1px solid #20242a;
            background: #0d1014;
        }
        .input-wrapper {
            max-width: 850px;
            margin: auto;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            background: #15191e;
            border: 1px solid #2a3037;
            border-radius: 13px;
            padding: 7px;
        }
        textarea {
            flex: 1;
            min-height: 43px;
            max-height: 140px;
            resize: none;
            border: 0;
            outline: 0;
            background: transparent;
            color: white;
            padding: 11px;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }
        textarea::placeholder {
            color: #69727d;
        }
        .send-btn {
            width: 43px;
            height: 43px;
            border: 0;
            border-radius: 9px;
            background: #1677ff;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .send-btn:hover {
            background: #0868ee;
        }
        .send-btn:disabled {
            opacity: .45;
            cursor: default;
        }
        .send-btn svg {
            width: 19px;
            height: 19px;
        }
        .footer {
            max-width: 850px;
            margin: 7px auto 0;
            color: #555e68;
            font-size: 10px;
            text-align: center;
        }
        @media (max-width: 600px) {
            .header {
                padding: 0 14px;
            }
            .chat {
                padding: 20px 12px;
            }
            .bubble {
                max-width: 90%;
            }
            .welcome {
                margin-top: 12vh;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <!-- Header -->
    <header class="header">
        <div class="brand">
            <div class="brand-icon">
                <!-- AI / Spark SVG -->
                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     stroke-linecap="round"
                     stroke-linejoin="round">
                    <path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/>
                    <path d="M19 16l.7 2.3L22 19l-2.3.7L19 22l-.7-2.3L16 19l2.3-.7L19 16z"/>
                </svg>
            </div>
            Lua AI
        </div>
        <div class="status">
            <span class="status-dot"></span>
            متصل
        </div>
    </header>
    <!-- Chat -->
    <main class="chat" id="chat">
        <div class="messages" id="messages">
            <div class="welcome" id="welcome">
                <h1>Lua AI</h1>
                <p>
                    مساعدك لبرمجة Roblox Studio باستخدام Lua
                </p>
            </div>
        </div>
    </main>
    <!-- Input -->
    <section class="input-area">
        <div class="input-wrapper">
            <textarea
                id="messageInput"
                placeholder="اكتب سؤالك عن Roblox أو Lua..."
                rows="1"
            ></textarea>
            <button
                class="send-btn"
                id="sendBtn"
                title="إرسال"
            >
                <!-- Send SVG -->
                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     stroke-linecap="round"
                     stroke-linejoin="round">
                    <path d="M22 2L11 13"/>
                    <path d="M22 2L15 22L11 13L2 9L22 2Z"/>
                </svg>
            </button>
        </div>
        <div class="footer">
            Lua AI قد يخطئ. تحقق من الأكواد قبل استخدامها.
        </div>
    </section>
</div>
<script>
    const input = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const messages = document.getElementById("messages");
    const chat = document.getElementById("chat");
    const welcome = document.getElementById("welcome");
    /* إرسال الرسالة */
    async function sendMessage() {
        const text = input.value.trim();
        if (!text) return;
        if (welcome) {
            welcome.remove();
        }
        addMessage("user", escapeHTML(text));
        input.value = "";
        input.style.height = "43px";
        sendBtn.disabled = true;
        try {
            /*
             * هنا يتم الاتصال بالـ Backend الموجود في Render
             */
            const response = await fetch("/api/chat", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: text
                })
            });
            if (!response.ok) {
                throw new Error("حدث خطأ في الاتصال بالسيرفر");
            }
            const data = await response.json();
            addAIMessage(data.reply);
        } catch (error) {
            addMessage(
                "ai",
                "حدث خطأ أثناء الاتصال بالذكاء الاصطناعي."
            );
            console.error(error);
        } finally {
            sendBtn.disabled = false;
        }
    }
    /* إضافة رسالة عادية */
    function addMessage(type, text) {
        const message = document.createElement("div");
        message.className = "message " + type;
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.innerHTML = text;
        message.appendChild(bubble);
        messages.appendChild(message);
        scrollBottom();
    }
    /* رسالة AI */
    function addAIMessage(text) {
        const message = document.createElement("div");
        message.className = "message ai";
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        /*
         * نتوقع أن الـ Backend يرجع:
         *
         * النص العادي
         *
         * أو كود بالشكل:
         *
         * ```lua
         * print("Hello")
         * ```
         */
        const parts = parseCode(text);
        if (parts.length === 1 && parts[0].type === "text") {
            bubble.textContent = parts[0].content;
        } else {
            parts.forEach(part => {
                if (part.type === "text") {
                    const textElement = document.createElement("div");
                    textElement.textContent = part.content;
                    bubble.appendChild(textElement);
                }
                if (part.type === "code") {
                    const codeBox = createCodeBox(part.content);
                    bubble.appendChild(codeBox);
                }
            });
        }
        message.appendChild(bubble);
        messages.appendChild(message);
        scrollBottom();
    }
    /* تحويل Markdown code إلى أجزاء */
    function parseCode(text) {
        const result = [];
        const regex = /```(?:lua|luau|javascript|js|text)?\s*([\s\S]*?)```/gi;
        let lastIndex = 0;
        let match;
        while ((match = regex.exec(text)) !== null) {
            if (match.index > lastIndex) {
                result.push({
                    type: "text",
                    content: text.slice(lastIndex, match.index).trim()
                });
            }
            result.push({
                type: "code",
                content: match[1].trim()
            });
            lastIndex = regex.lastIndex;
        }
        if (lastIndex < text.length) {
            result.push({
                type: "text",
                content: text.slice(lastIndex).trim()
            });
        }
        return result.filter(item => item.content);
    }
    /* إنشاء Code Box */
    function createCodeBox(code) {
        const box = document.createElement("div");
        box.className = "code-box";
        const header = document.createElement("div");
        header.className = "code-header";
        const language = document.createElement("span");
        language.className = "code-language";
        language.textContent = "Lua";
        const copyButton = document.createElement("button");
        copyButton.className = "copy-btn";
        copyButton.title = "نسخ الكود";
        copyButton.innerHTML = `
            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2"/>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            <span>نسخ</span>
        `;
        const pre = document.createElement("pre");
        const codeElement = document.createElement("code");
        codeElement.textContent = code;
        pre.appendChild(codeElement);
        copyButton.addEventListener("click", async () => {
            await navigator.clipboard.writeText(code);
            copyButton.querySelector("span").textContent = "تم النسخ";
            setTimeout(() => {
                copyButton.querySelector("span").textContent = "نسخ";
            }, 1500);
        });
        header.appendChild(language);
        header.appendChild(copyButton);
        box.appendChild(header);
        box.appendChild(pre);
        return box;
    }
    /* إرسال بزر Enter */
    input.addEventListener("keydown", event => {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    });
    /* تكبير Textarea */
    input.addEventListener("input", () => {
        input.style.height = "43px";
        input.style.height =
            Math.min(input.scrollHeight, 140) + "px";
    });
    /* النزول لآخر رسالة */
    function scrollBottom() {
        setTimeout(() => {
            chat.scrollTop = chat.scrollHeight;
        }, 50);
    }
    /* حماية النص */
    function escapeHTML(text) {
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
</script>
</body>
</html>
