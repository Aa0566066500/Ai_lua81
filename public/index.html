<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد Roblox Studio الذكي</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; height: 100vh; display: flex; overflow: hidden; }

        /* القائمة الجانبية */
        .sidebar { width: 260px; background: #161b22; border-left: 1px solid #30363d; display: flex; flex-direction: column; transition: 0.3s; z-index: 100; }
        .sidebar-header { padding: 15px; border-bottom: 1px solid #30363d; font-weight: bold; color: #58a6ff; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
        .sidebar-content { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .sidebar-content label { font-size: 12px; color: #8ab4f8; margin-bottom: 3px; }
        .sidebar-content input, .sidebar-content textarea { width: 100%; background: #0d1117; border: 1px solid #30363d; color: #fff; padding: 8px; border-radius: 6px; font-size: 12px; }
        
        .new-chat-btn { background: #238636; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; font-size: 13px; }
        .new-chat-btn:hover { background: #2ea043; }

        /* منطقة الدردشة الرئيسية */
        .main-chat-area { flex: 1; display: flex; flex-direction: column; background: #0d1117; height: 100vh; position: relative; }
        
        .chat-header { background: #161b22; padding: 12px 15px; border-bottom: 1px solid #30363d; display: flex; align-items: center; justify-content: space-between; }
        .chat-header h2 { font-size: 15px; color: #58a6ff; }
        .menu-toggle { background: none; border: none; color: #c9d1d9; font-size: 20px; cursor: pointer; display: none; }

        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        
        .message { max-width: 80%; padding: 10px 14px; border-radius: 8px; font-size: 13px; line-height: 1.5; word-break: break-word; }
        .user-message { background: #1f6feb; color: white; align-self: flex-start; }
        .ai-message { background: #161b22; border: 1px solid #30363d; color: #e6edf3; align-self: flex-end; white-space: pre-wrap; font-family: monospace; }

        /* شريط الإدخال السفلي */
        .chat-input-area { background: #161b22; padding: 12px; border-top: 1px solid #30363d; display: flex; flex-direction: column; gap: 8px; }
        .file-preview-bar { display: flex; align-items: center; justify-content: space-between; background: #21262d; padding: 5px 10px; border-radius: 6px; font-size: 12px; border: 1px solid #30363d; display: none; }
        .file-preview-bar span { color: #7ee787; }
        .remove-file { background: none; border: none; color: #f85149; font-weight: bold; cursor: pointer; font-size: 14px; }

        .input-row { display: flex; gap: 8px; align-items: center; }
        .input-row textarea { flex: 1; background: #0d1117; border: 1px solid #30363d; color: #fff; padding: 8px 12px; border-radius: 6px; resize: none; height: 40px; font-size: 13px; font-family: Tahoma, sans-serif; }
        .icon-btn { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; width: 40px; height: 40px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .icon-btn:hover { background: #30363d; }
        .send-btn { background: #238636; color: white; border: none; width: 40px; height: 40px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .send-btn:hover { background: #2ea043; }

        /* للشاشات الصغيرة */
        @media (max-width: 768px) {
            .sidebar { position: absolute; height: 100%; right: -260px; }
            .sidebar.active { right: 0; }
            .menu-toggle { display: block; }
        }
    </style>
</head>
<body>

    <!-- القائمة الجانبية -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span>الإعدادات والتحكم</span>
        </div>
        <div class="sidebar-content">
            <button class="new-chat-btn" onclick="clearChat()">+ محادثة جديدة</button>
            <br>
            <label for="systemInstructionInput">تعليمات النظام (System Instruction):</label>
            <textarea id="systemInstructionInput" rows="4" placeholder="مثلاً: أنت خبير في برمجة Roblox Lua وتطوير الألعاب...">أنت مساعد ذكي ومحترف في لغة Lua وتطوير ألعاب Roblox Studio.</textarea>
        </div>
    </div>

    <!-- منطقة الدردشة الرئيسية -->
    <div class="main-chat-area">
        <div class="chat-header">
            <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
            <h2>مساعد Roblox Studio الذكي (Lua)</h2>
            <div style="width: 24px;"></div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message ai-message">أهلاً بك! أنا جاهز لمساعدتك في أكواد ورشات Roblox Studio ومراجعتها. كيف يمكنني مساعدتك اليوم؟</div>
        </div>

        <div class="chat-input-area">
            <div class="file-preview-bar" id="filePreviewBar">
                <span id="fileName"></span>
                <button class="remove-file" onclick="removeFile()">✕</button>
            </div>
            <div class="input-row">
                <input type="file" id="fileInput" style="display:none;" onchange="handleFileSelect()">
                <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="إرفاق ملف">📁</button>
                <textarea id="messageInput" placeholder="اكتب سؤالك أو الكود هنا..." rows="1" onkeydown="handleKeyDown(event)"></textarea>
                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <script>
        let attachedFile = null;

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        function handleFileSelect() {
            const input = document.getElementById('fileInput');
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    attachedFile = {
                        name: file.name,
                        data: e.target.result.split(',')[1],
                        mimeType: file.type || 'text/plain'
                    };
                    document.getElementById('fileName').innerText = '📄 ' + file.name;
                    document.getElementById('filePreviewBar').style.display = 'flex';
                };
                reader.readAsDataURL(file);
            }
        }

        function removeFile() {
            attachedFile = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('filePreviewBar').style.display = 'none';
        }

        function clearChat() {
            document.getElementById('chatMessages').innerHTML = `
                <div class="message ai-message">أهلاً بك! أنا جاهز لمساعدتك في أكواد ورشات Roblox Studio ومراجعتها. كيف يمكنني مساعدتك اليوم؟</div>
            `;
            removeFile();
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            const inputEl = document.getElementById('messageInput');
            const message = inputEl.value.trim();
            const systemInstruction = document.getElementById('systemInstructionInput').value;

            if (!message && !attachedFile) return;

            const chatMessages = document.getElementById('chatMessages');

            // عرض رسالة المستخدم
            let userDisplay = message;
            if (attachedFile) {
                userDisplay += `\n[ملف مرفق: ${attachedFile.name}]`;
            }
            
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-message';
            userDiv.innerText = userDisplay;
            chatMessages.appendChild(userDiv);

            inputEl.value = '';
            const currentFile = attachedFile;
            removeFile();
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // إضافة رسالة "جاري الكتابة..."
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message ai-message';
            loadingDiv.innerText = 'جاري المعالجة...';
            chatMessages.appendChild(loadingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: message || "قم بتحليل الملف المرفق",
                        image: currentFile,
                        systemInstruction: systemInstruction
                    })
                });

                const data = await res.json();
                chatMessages.removeChild(loadingDiv);

                const aiDiv = document.createElement('div');
                aiDiv.className = 'message ai-message';
                if (data.success) {
                    aiDiv.innerText = data.reply;
                } else {
                    aiDiv.innerText = 'خطأ: ' + data.error;
                }
                chatMessages.appendChild(aiDiv);
            } catch (err) {
                chatMessages.removeChild(loadingDiv);
                const errorDiv = document.createElement('div');
                errorDiv.className = 'message ai-message';
                errorDiv.innerText = 'حدث خطأ في الاتصال بالخادم.';
                chatMessages.appendChild(errorDiv);
            }
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>
</body>
</html>
