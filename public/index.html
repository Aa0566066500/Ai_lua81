<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد Roblox Studio الذكي</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* هيدر محسّن يتكيف مع مساحة الهاتف العلوي ولا يختفي */
        header { background: #161b22; padding: max(15px, env(safe-area-inset-top)) 15px 15px 15px; text-align: center; border-bottom: 1px solid #30363d; flex-shrink: 0; z-index: 10; }
        header h1 { font-size: 16px; color: #58a6ff; font-weight: bold; }

        /* حاوية قابلة للتمرير بسلاسة لضمان رؤية جميع العناصر */
        .main-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }

        .section-box { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 15px; }
        .section-box h3 { margin-bottom: 10px; color: #8ab4f8; font-size: 15px; }

        textarea, input[type="file"] { width: 100%; background: #0d1117; border: 1px solid #30363d; color: #fff; padding: 10px; border-radius: 6px; margin-bottom: 10px; resize: vertical; font-family: monospace; font-size: 13px; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 5px; }
        button { padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .btn-green { background: #238636; color: #fff; flex: 1; }
        .btn-green:hover { background: #2ea043; }
        .btn-red { background: #da3633; color: #fff; flex: 1; }
        .btn-red:hover { background: #f85149; }

        /* معاينة الملف المرفق مع زر X للإلغاء */
        .file-preview { display: flex; align-items: center; justify-content: space-between; background: #21262d; padding: 8px 12px; border-radius: 6px; margin-bottom: 10px; font-size: 13px; border: 1px solid #30363d; }
        .file-preview span { color: #7ee787; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 85%; }
        .remove-file-btn { background: transparent; color: #f85149; border: none; font-size: 16px; cursor: pointer; padding: 0 5px; font-weight: bold; }
        .remove-file-btn:hover { color: #ff7b72; }

        .output-box { background: #0d1117; border: 1px solid #30363d; padding: 10px; border-radius: 6px; min-height: 70px; white-space: pre-wrap; margin-top: 10px; font-family: monospace; font-size: 12px; color: #e6edf3; }
    </style>
</head>
<body>

    <header>
        <h1>مساعد Roblox Studio الذكي (Lua)</h1>
    </header>

    <div class="main-container">
        <!-- محرر الكود -->
        <div class="section-box">
            <h3>محرر الكود (Code Editor)</h3>
            <input type="file" id="editorFileInput" style="display:none;" onchange="handleFileSelect('editor')">
            <button onclick="document.getElementById('editorFileInput').click()" style="background:#21262d; border:1px solid #30363d; color:#c9d1d9; width:100%; margin-bottom:10px;">📁 إرفاق ملف</button>
            <div id="editorFileContainer"></div>
            <textarea id="editorCode" placeholder="اكتب أو الصق كود Lua هنا..." rows="4"></textarea>
            <div class="btn-group">
                <button class="btn-green" onclick="runEditorAction()">تنفيذ / فحص</button>
                <button class="btn-red" onclick="clearEditor()">حذف الكل</button>
            </div>
            <div class="output-box" id="editorOutput">النتيجة ستظهر هنا...</div>
        </div>

        <!-- مصحح الأكواد -->
        <div class="section-box">
            <h3>مصحح الأكواد (Code Corrector)</h3>
            <input type="file" id="correctorFileInput" style="display:none;" onchange="handleFileSelect('corrector')">
            <button onclick="document.getElementById('correctorFileInput').click()" style="background:#21262d; border:1px solid #30363d; color:#c9d1d9; width:100%; margin-bottom:10px;">📁 إرفاق ملف</button>
            <div id="correctorFileContainer"></div>
            <textarea id="correctorCode" placeholder="الصق الكود الذي يحتوي على أخطاء هنا..." rows="4"></textarea>
            <div class="btn-group">
                <button class="btn-green" onclick="runCorrectorAction()">تصحيح الكود</button>
                <button class="btn-red" onclick="clearCorrector()">حذف الكل</button>
            </div>
            <div class="output-box" id="correctorOutput">الكود المصحح سيظهر هنا...</div>
        </div>
    </div>

    <script>
        let uploadedFiles = { editor: null, corrector: null };

        function handleFileSelect(type) {
            const fileInput = document.getElementById(type + 'FileInput');
            const container = document.getElementById(type + 'FileContainer');
            if (fileInput.files && fileInput.files[0]) {
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedFiles[type] = {
                        name: file.name,
                        data: e.target.result.split(',')[1],
                        mimeType: file.type || 'text/plain'
                    };
                    container.innerHTML = `
                        <div class="file-preview">
                            <span>📄 ${file.name}</span>
                            <button class="remove-file-btn" onclick="removeFile('${type}')">✕</button>
                        </div>
                    `;
                };
                reader.readAsDataURL(file);
            }
        }

        function removeFile(type) {
            uploadedFiles[type] = null;
            document.getElementById(type + 'FileInput').value = '';
            document.getElementById(type + 'FileContainer').innerHTML = '';
        }

        function clearEditor() {
            document.getElementById('editorCode').value = '';
            removeFile('editor');
            document.getElementById('editorOutput').innerText = 'النتيجة ستظهر هنا...';
        }

        function clearCorrector() {
            document.getElementById('correctorCode').value = '';
            removeFile('corrector');
            document.getElementById('correctorOutput').innerText = 'الكود المصحح سيظهر هنا...';
        }

        async function sendRequest(prompt, imageObj, outputId) {
            const outputEl = document.getElementById(outputId);
            outputEl.innerText = 'جاري المعالجة...';
            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: prompt, image: imageObj })
                });
                const data = await res.json();
                if (data.success) {
                    outputEl.innerText = data.reply;
                } else {
                    outputEl.innerText = 'خطأ: ' + data.error;
                }
            } catch (err) {
                outputEl.innerText = 'حدث خطأ في الاتصال بالخادم.';
            }
        }

        function runEditorAction() {
            const code = document.getElementById('editorCode').value;
            if (!code && !uploadedFiles.editor) {
                alert('الرجاء كتابة كود أو إرفاق ملف أولاً.');
                return;
            }
            sendRequest("قم بمراجعة وتحليل كود Roblox Lua التالي:\n" + code, uploadedFiles.editor, 'editorOutput');
        }

        function runCorrectorAction() {
            const code = document.getElementById('correctorCode').value;
            if (!code && !uploadedFiles.corrector) {
                alert('الرجاء كتابة كود أو إرفاق ملف للتصحيح.');
                return;
            }
            sendRequest("قم بتصحيح الأخطاء البرمجية في كود Roblox Lua التالي وإرجاع الكود الصحيح فقط مع شرح بسيط:\n" + code, uploadedFiles.corrector, 'correctorOutput');
        }
    </script>
</body>
</html>
